<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>LocalMind</title>
<style>
:root{--bg:#0f1226;--sf:#1a1e3a;--ln:#2a2f55;--tx:#eceefb;--mu:#8e94c2;--ac:#7c6cff;--ac2:#4fd8eb}
*{box-sizing:border-box}html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,Segoe UI,Roboto,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:820px;margin:auto;padding-top:env(safe-area-inset-top)}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--ln)}
header h1{font-size:18px;margin:0;flex:1}
.dot{width:10px;height:10px;border-radius:50%;background:#666}.dot.ok{background:var(--ac2)}
button{font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:8px 14px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
#log{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:18px}
.m{white-space:pre-wrap;word-wrap:break-word;max-width:92%}
.u{align-self:flex-end;background:var(--ac);padding:10px 14px;border-radius:18px 18px 4px 18px}
.a{align-self:flex-start}
.empty{margin:auto;text-align:center;color:var(--mu)}
form#f{display:flex;gap:8px;padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--ln)}
textarea{flex:1;resize:none;max-height:140px;font:inherit;color:var(--tx);background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:10px 14px}
#send{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#0f1226;font-weight:700}
dialog{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:18px;width:min(92vw,420px)}
dialog::backdrop{background:#0009}label{display:block;margin:10px 0 4px;color:var(--mu);font-size:14px}
input{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px 12px}
@media(prefers-reduced-motion:no-preference){.a.live::after{content:"▍";color:var(--ac2);animation:b 1s steps(2) infinite}}
@keyframes b{50%{opacity:0}}
select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:9px 12px}
.note{color:var(--mu);font-size:14px;margin:8px 0}.warn{color:#ffb86b;font-size:14px;margin:8px 0}
.alt{display:block;width:100%;text-align:left;margin:6px 0;font-size:14px}.row{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}a{color:var(--ac2)}a.btn{background:var(--sf);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:8px 14px;text-decoration:none}
.m img{display:block;max-width:220px;max-height:220px;border-radius:12px;margin-bottom:6px}
#prev{display:none;padding:8px 16px 0}#prev.on{display:flex;align-items:center;gap:8px}#prev img{height:56px;border-radius:10px}#att{padding:8px 12px}
#upd{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--sf);border-bottom:1px solid var(--ln);font-size:14px}#upd[hidden]{display:none}#upd span{flex:1}
</style></head><body><div id="app">
<header><span class="dot" id="dot"></span><h1>LocalMind</h1><button id="new">New</button><button id="mdl">Model</button><button id="cfg">Server</button></header>
<div id="upd" hidden><span id="updt"></span><button id="updb"></button></div>
<div id="log"></div>
<div id="prev"></div>
<form id="f"><button type="button" id="att" aria-label="Attach photo">📎</button><input type="file" id="file" accept="image/*" hidden><textarea id="q" rows="1" placeholder="Message your model"></textarea><button id="send" type="submit">Send</button></form>
<dialog id="d"><form method="dialog">
<label>Server URL (from Colab)</label><input id="url" placeholder="https://xxxx.trycloudflare.com" autocapitalize="off">
<label>API key</label><input id="key" placeholder="same key as in Colab" autocapitalize="off">
<p style="margin:16px 0 0;text-align:right"><button value="x">Save</button></p></form></dialog>
<dialog id="md"><div><label>Hugging Face link</label><input id="hf" placeholder="https://huggingface.co/owner/model" autocapitalize="off">
<label>Free GPU</label><select id="gpu"><option value="T4">T4 (free, 16 GB)</option><option value="K2">Kaggle 2×T4 (free, 30 GB)</option><option value="L4">L4 (24 GB, paid Colab)</option><option value="A100">A100 (40 GB, paid Colab)</option></select>
<details style="margin-top:12px"><summary>Accounts (optional, for one-tap launch)</summary>
<label>Kaggle username</label><input id="kgu" autocapitalize="off"><label>Kaggle API key</label><input id="kgk" type="password" autocapitalize="off">
<label>Google OAuth client ID</label><input id="gid" autocapitalize="off"><label>Google OAuth client secret</label><input id="gsec" type="password" autocapitalize="off">
<p class="note">Saved only on this device. See the README for setup.</p></details>
<p><button id="gen">Generate notebook</button></p><div id="res"></div><p style="text-align:right;margin:12px 0 0"><button id="mclose">Close</button></p></div></dialog></div>
<script src="version.js"></script>
<script src="cloud.js"></script>
<script src="colab.js"></script>
<script>
const $=i=>document.getElementById(i),S=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return ""}};
let hist=[],busy=false,ctl,MODEL,img=null;const log=$("log");
function empty(){log.innerHTML='<div class="empty">Your model runs on your Colab GPU.<br>Add the server link to start.</div>'}
function add(c,t){const e=document.createElement("div");e.className="m "+c;e.textContent=t;log.appendChild(e);log.scrollTop=log.scrollHeight;return e}
function base(){return S("url").trim().replace(/\/+$/,"")}
function H(){const h={"Content-Type":"application/json"};if(S("key"))h.Authorization="Bearer "+S("key").trim();return h}
async function ping(){MODEL=undefined;try{const r=await fetch(base()+"/v1/models",{headers:H()});$("dot").className="dot"+(r.ok?" ok":"");if(r.ok){const j=await r.json();MODEL=j.data&&j.data[0]&&j.data[0].id}}catch(e){$("dot").className="dot"}}
$("cfg").onclick=()=>{$("url").value=S("url");$("key").value=S("key");$("d").showModal()};
$("d").onclose=()=>{S("url",$("url").value);S("key",$("key").value);ping()};
$("new").onclick=()=>{ctl&&ctl.abort();hist=[];empty()};
$("q").oninput=e=>{e.target.style.height="auto";e.target.style.height=e.target.scrollHeight+"px"};
$("q").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&matchMedia("(pointer:fine)").matches){e.preventDefault();$("f").requestSubmit()}};
$("send").onclick=e=>{if(busy){e.preventDefault();ctl.abort()}};
$("att").onclick=()=>$("file").click();
function showPrev(){const p=$("prev");p.replaceChildren();p.className=img?"on":"";if(!img)return;const t=document.createElement("img");t.src=img;const x=document.createElement("button");x.type="button";x.textContent="✕";x.setAttribute("aria-label","Remove photo");x.onclick=()=>{img=null;showPrev()};p.append(t,x)}
$("file").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
 try{const b=await createImageBitmap(f),k=Math.min(1,1024/Math.max(b.width,b.height)),c=document.createElement("canvas");c.width=Math.round(b.width*k);c.height=Math.round(b.height*k);c.getContext("2d").drawImage(b,0,0,c.width,c.height);img=c.toDataURL("image/jpeg",0.85);showPrev()}catch(_){add("a","Couldn't read that photo.")}};
$("f").onsubmit=async e=>{
 e.preventDefault();if(busy)return;const t=$("q").value.trim();if(!t&&!img)return;
 if(!base()){$("cfg").click();return}
 if(!MODEL)await ping();
 if(!hist.length)log.innerHTML="";
 const pic=img;img=null;showPrev();$("q").value="";$("q").style.height="auto";
 const ub=add("u",t);if(pic){const im=document.createElement("img");im.src=pic;ub.prepend(im)}
 hist.push({role:"user",content:pic?[{type:"text",text:t||"Describe this photo."},{type:"image_url",image_url:{url:pic}}]:t});
 const out=add("a live","");let txt="";busy=true;$("send").textContent="Stop";ctl=new AbortController();
 try{
  const r=await fetch(base()+"/v1/chat/completions",{method:"POST",headers:H(),signal:ctl.signal,body:JSON.stringify({model:MODEL,messages:hist.slice(-20).map((m,k,a)=>k<a.length-1&&Array.isArray(m.content)?{role:m.role,content:m.content[0].text}:m),stream:true,temperature:0.7})});
  if(!r.ok)throw new Error("Server answered "+r.status+". Check the link and key."+(pic?" If you attached a photo, this model may not read images.":""));
  const rd=r.body.getReader(),dc=new TextDecoder();let buf="";
  for(;;){const{done,value}=await rd.read();if(done)break;buf+=dc.decode(value,{stream:true});
   const ls=buf.split("\n");buf=ls.pop();
   for(const l of ls){if(!l.startsWith("data:"))continue;const p=l.slice(5).trim();if(p==="[DONE]")continue;
    try{const c=JSON.parse(p).choices[0].delta.content;if(c){txt+=c;out.textContent=txt;log.scrollTop=log.scrollHeight}}catch(_){}}}
 }catch(err){if(err.name!=="AbortError")out.textContent=txt||("Can't reach the server. "+err.message)}
 out.classList.remove("live");if(txt)hist.push({role:"assistant",content:txt});
 busy=false;$("send").textContent="Send";
};
window.lmConnect=(u,k)=>{S("url",u);S("key",k);ping().then(()=>{if(!hist.length){log.innerHTML="";add("a","Server connected. Say hi!")}})};
empty();if(base())ping();if(S("lm_ch"))LM.listen();
</script>
<script src="update.js"></script></body></html>
